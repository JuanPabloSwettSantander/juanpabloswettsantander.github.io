<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juan Pablo Swett Santander</title>
<meta name="description" content="Gobierno de IA y cloud para empresas medianas. Sitio en preparación.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f5f2; --ink:#17202b; --muted:#586271; --rule:#d5d9d2; --accent:#1e5a57; }
  @media (prefers-color-scheme: dark) { :root { --paper:#12171d; --ink:#e6e9e5; --muted:#9aa3ad; --rule:#2b333c; --accent:#7dbdb3; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Schibsted Grotesk', system-ui, sans-serif;
         display:flex; align-items:center; padding:48px max(16px, 6vw); }
  main { max-width: 720px; }
  .name { font-weight:600; font-size:1rem; margin:0 0 48px; }
  h1 { font-weight:500; font-size:clamp(2rem, 5.5vw, 3.6rem); letter-spacing:-0.035em; line-height:1.05; margin:0; text-wrap:balance; }
  p.lede { color:var(--muted); font-size:clamp(1.05rem, 2vw, 1.25rem); line-height:1.5; margin:24px 0 40px; max-width:46ch; }
  .links { border-top:1px solid var(--rule); padding-top:20px; display:flex; flex-wrap:wrap; gap:12px 28px; }
  a { color:var(--accent); text-underline-offset:0.2em; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <p class="name">Juan Pablo Swett Santander</p>
    <h1>IA y cloud gobernados para empresas medianas.</h1>
    <p class="lede">El sitio está en preparación. Mientras tanto, mi trayectoria y publicaciones están en LinkedIn.</p>
    <div class="links">
      <a href="https://www.linkedin.com/in/juanpabloswettsantander">LinkedIn</a>
      <a href="https://github.com/JuanPabloSwettSantander">GitHub</a>
    </div>
  </main>
</body>
</html>
